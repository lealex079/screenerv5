name: Desk weekly digest

# Sunday 6 PM Pacific: fresh snapshot, screens, digest email, pick history committed (picks only, no UW rows).
# Refuses to run in a public repo (UW data licensing). Needs secrets: UW_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, EMAIL_TO.
on:
  schedule:
    - cron: "11 1 * * 1"   # 6:11 PM PDT Sunday
    - cron: "11 2 * * 1"   # 6:11 PM PST Sunday
  workflow_dispatch:
    inputs:
      email_mode:
        description: "print = preview only, send = email"
        default: "print"
        type: choice
        options: ["print", "send"]

permissions:
  contents: write

jobs:
  digest:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pacific-time guard
        id: guard
        run: |
          H=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "18" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "not 6 PM Pacific ($H), skipping"; fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with: { python-version: "3.12", cache: "pip" }
      - name: Install
        if: steps.guard.outputs.go == 'true'
        run: pip install pandas numpy pyarrow
      - name: Ingest, digest, export
        if: steps.guard.outputs.go == 'true'
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_MODE: ${{ github.event.inputs.email_mode || 'send' }}
        run: python -m desk.cli all --out desk_out
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.go == 'true'
        with: { name: desk-digest, path: "desk_out/desk_digest.html", retention-days: 30 }
      - name: Commit pick history
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add desk_history.json && (git diff --cached --quiet || git commit -m "desk: pick history $(date -u +%F)") && git push || true
