name: Daily Screener Pipeline

on:
  schedule:
    # GitHub cron is UTC-only and has no DST awareness, so we schedule BOTH the
    # PST and PDT firing times for 7:00 AM Pacific and let the pipeline's own
    # guard (PACIFIC_HOUR check) no-op the one that isn't 7 AM Pacific today.
    # This keeps delivery at 7 AM Pacific year-round with no twice-a-year edit.
    - cron: "0 15 * * 1-5"   # 7:00 AM PST (UTC-8), active Nov–Mar
    - cron: "0 14 * * 1-5"   # 7:00 AM PDT (UTC-7), active Mar–Nov

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      tickers:
        description: "Override tickers (comma-separated, leave blank for Finviz)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (scan + pre-gate only — no options, Claude, or email)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt   # single source of truth — keep in sync with local

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY:  ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS=""

          # Dry run flag
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Manual ticker override
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi

          python pipeline.py $ARGS

      - name: Upload email preview (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: screener_email_preview.html
          retention-days: 3

      - name: Notify on failure
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          RUN_URL:          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' || echo "failure-notify step could not send alert"
          import os
          key = os.environ.get("SENDGRID_API_KEY")
          to  = [e.strip() for e in os.environ.get("EMAIL_TO","").split(",") if e.strip()]
          if not (key and to):
              print("no SendGrid creds/recipients — skipping alert"); raise SystemExit(0)
          import sendgrid
          from sendgrid.helpers.mail import Mail
          msg = Mail(
              from_email=os.environ.get("EMAIL_FROM","screener@cpa-cfo-now.com"),
              to_emails=to,
              subject="⚠️ Screener pipeline FAILED",
              html_content=f'The daily screener run failed. Logs: '
                           f'<a href="{os.environ.get("RUN_URL","")}">{os.environ.get("RUN_URL","")}</a>',
          )
          r = sendgrid.SendGridAPIClient(api_key=key).send(msg)
          print("alert sent, status", r.status_code)
          PY