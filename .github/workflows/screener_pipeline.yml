name: Monday Screener Watchlist

on:
  schedule:
    # GitHub cron is UTC-only and has no DST awareness, so we schedule BOTH the
    # PST and PDT firing times for 7:00 AM Pacific and let the pipeline's own
    # guard (PACIFIC_HOUR check) no-op the one that isn't 7 AM Pacific today.
    # This keeps delivery at 7 AM Pacific year-round with no twice-a-year edit.
    # Day-of-week "1" = Monday only.
    - cron: "0 15 * * 1"   # 7:00 AM PST (UTC-8), active Nov–Mar
    - cron: "0 14 * * 1"   # 7:00 AM PDT (UTC-7), active Mar–Nov

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      tickers:
        description: "Override tickers (comma-separated, leave blank for Finviz)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no Claude, no email)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      top_n:
        description: "Number of full reports (default 10)"
        required: false
        default: "10"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # full 300-ticker scan should finish in ~20 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt   # single source of truth — keep in sync with local

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          SMTP_HOST:         ${{ vars.SMTP_HOST || 'smtp.resend.com' }}
          SMTP_PORT:         ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER:         ${{ vars.SMTP_USER || 'resend' }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          TOP_N:             ${{ github.event.inputs.top_n || '10' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS=""

          # Dry run flag
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Manual ticker override
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            ARGS="$ARGS --tickers ${{ github.event.inputs.tickers }}"
          fi

          python pipeline.py $ARGS

      - name: Upload email preview (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: screener_email_preview.html
          retention-days: 3

      - name: Notify on failure
        if: failure()
        env:
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_HOST:  ${{ vars.SMTP_HOST || 'smtp.resend.com' }}
          SMTP_PORT:  ${{ vars.SMTP_PORT || '465' }}
          SMTP_USER:  ${{ vars.SMTP_USER || 'resend' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:   ${{ secrets.EMAIL_TO }}
          RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Silence is the worst failure mode for something people rely on, so a
          # broken run emails an alert. Best-effort: if the alert itself can't
          # send, don't mask the real error. Uses stdlib smtplib — no SDK.
          python - <<'PY' || echo "failure-notify step could not send alert"
          import os, smtplib
          from email.message import EmailMessage
          pw = os.environ.get("SMTP_PASS")
          to = [e.strip() for e in os.environ.get("EMAIL_TO","").split(",") if e.strip()]
          if not (pw and to):
              print("no SMTP creds/recipients — skipping alert"); raise SystemExit(0)
          url = os.environ.get("RUN_URL","")
          m = EmailMessage()
          m["Subject"] = "Screener pipeline FAILED"
          m["From"] = os.environ.get("EMAIL_FROM","")
          m["To"] = ", ".join(to)
          m.set_content(f"The Monday screener run failed.\n\nLogs: {url}")
          m.add_alternative(f'The Monday screener run failed. '
                            f'Logs: <a href="{url}">{url}</a>', subtype="html")
          host = os.environ.get("SMTP_HOST","smtp.resend.com")
          port = int(os.environ.get("SMTP_PORT","465"))
          user = os.environ.get("SMTP_USER","resend")
          if port in (465, 2465):
              with smtplib.SMTP_SSL(host, port, timeout=30) as s:
                  s.login(user, pw); s.send_message(m)
          else:
              with smtplib.SMTP(host, port, timeout=30) as s:
                  s.starttls(); s.login(user, pw); s.send_message(m)
          print("alert sent")
          PY