name: Midweek Coverage Update

# Wed + Fri, pinned names only. No Finviz, no discovery — those run Sunday.
# Requested by Sean and Frank 2026-09-09: automated picks weekly, custom
# tickers revised three times a week.

on:
  schedule:
    # 6:07 AM Pacific Wed and Fri, before the open. Both DST halves registered;
    # pipeline.py's SCHEDULES table no-ops whichever does not own today.
    # MUST match SCHEDULES in pipeline.py exactly.
    - cron: "7 13 * * 3,5"   # 6:07 AM PDT, active Mar–Nov
    - cron: "7 14 * * 3,5"   # 6:07 AM PST, active Nov–Mar

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Claude, no email)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# The run commits coverage_state.json back so the NEXT run can diff against it.
permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # 4 tickers — nothing like the Sunday screen

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run coverage update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
          SMTP_HOST:         ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT:         ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON:     ${{ github.event.schedule }}
          PINNED_TICKERS:    ${{ vars.PINNED_TICKERS || 'AVAV,IIPR,INTU,ACN' }}
        run: |
          ARGS="--mode coverage"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python pipeline.py $ARGS

      # Persist the snapshot so Friday can diff against Wednesday. Runs only on
      # success: if the send failed, the reader never saw this run, and the next
      # diff should be against what they last actually read.
      - name: Commit coverage state
        if: success()
        run: |
          if [ -n "$(git status --porcelain coverage_state.json)" ]; then
            git config user.name  "screener-bot"
            git config user.email "actions@github.com"
            git add coverage_state.json
            git commit -m "coverage state $(date -u +%Y-%m-%d)"
            # Another run may have pushed since checkout; rebase rather than fail.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          else
            echo "coverage_state.json unchanged — nothing to commit"
          fi

      - name: Upload email preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-preview
          path: screener_email_preview.html
          retention-days: 14
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          SMTP_HOST:  ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT:  ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER:  ${{ secrets.SMTP_USER }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ALERT_TO:   ${{ secrets.ALERT_TO || secrets.EMAIL_FROM }}
          RUN_URL:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' || echo "failure-notify step could not send alert"
          import os, smtplib
          from email.message import EmailMessage
          pw = os.environ.get("SMTP_PASS")
          to = [e.strip() for e in os.environ.get("ALERT_TO","").split(",") if e.strip()]
          if not (pw and to):
              print("no SMTP creds/recipients — skipping alert"); raise SystemExit(0)
          url = os.environ.get("RUN_URL","")
          m = EmailMessage()
          m["Subject"] = "Coverage update FAILED"
          m["From"] = os.environ.get("EMAIL_FROM","")
          m["To"] = ", ".join(to)
          m.set_content(f"The midweek coverage run failed.\n\nLogs: {url}")
          host = os.environ.get("SMTP_HOST","smtp.gmail.com")
          port = int(os.environ.get("SMTP_PORT","587"))
          user = os.environ.get("SMTP_USER","")
          if port in (465, 2465):
              with smtplib.SMTP_SSL(host, port, timeout=30) as s:
                  s.login(user, pw); s.send_message(m)
          else:
              with smtplib.SMTP(host, port, timeout=30) as s:
                  s.starttls(); s.login(user, pw); s.send_message(m)
          print("alert sent")
          PY
